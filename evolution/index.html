<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141020">
<title>픽셀몬스터 진화 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#141020;--surface:#1d1730;--raised:#271f3f;
  --edge:#3a2f56;--edge-soft:#2b2242;
  --ink:#f2edfa;--dim:#9c8fb8;--dimmer:#6f6389;
  --cyan:#6fd3e0;--pink:#f273b0;--gold:#ffb45c;
  --line:#8a5a3c;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --gap:30px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.5;padding-bottom:60px;
}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
.mast{padding:30px 0 14px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dimmer);font-family:var(--mono);font-weight:600;display:block}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:30px;margin:4px 0 0;color:var(--cyan)}
.sub{margin:6px 0 0;color:var(--dim);font-size:12.5px}

.sitenav{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.sitenav a{
  font-size:12.5px;font-weight:600;line-height:1.2;text-decoration:none;color:var(--dim);
  background:var(--surface);border:2px solid var(--edge-soft);padding:5px 11px;
  transition:color .12s,border-color .12s;
}
.sitenav a:hover{color:var(--ink);border-color:var(--edge)}
.sitenav a.here{background:var(--ink);color:var(--ground);border-color:var(--ink);cursor:default}

.bar{
  position:sticky;top:0;z-index:5;margin:14px -16px 0;padding:10px 16px;
  background:rgba(20,16,32,.94);backdrop-filter:blur(6px);
  border-bottom:2px solid var(--edge-soft);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.bar input{
  flex:1 1 200px;min-width:0;background:var(--surface);border:2px solid var(--edge);color:var(--ink);
  padding:7px 11px;font:inherit;font-size:14px;
}
.bar input::placeholder{color:var(--dimmer)}
.bar input:focus{outline:none;border-color:var(--cyan)}
.btn{
  background:var(--surface);border:2px solid var(--edge);color:var(--dim);
  font:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;
}
.btn:hover{color:var(--ink);border-color:var(--dim)}
.hint{font-size:12px;color:var(--dimmer);font-family:var(--mono)}

.scroller{overflow:auto;padding:22px 4px 30px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#tree{width:max-content;zoom:var(--k,1)}
#tree ul{list-style:none;margin:0;padding:0}
#tree li{display:flex;align-items:center;position:relative}
#tree li>ul{display:flex;flex-direction:column}
#tree li>ul>li{padding:8px 0 8px var(--gap)}
/* 연결선: 부모 오른쪽 짧은 줄 + 자식 앞 세로줄·가로줄 */
#tree li>ul>li::before{content:"";position:absolute;left:0;top:50%;width:var(--gap);border-top:3px solid var(--line)}
#tree li>ul>li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:3px solid var(--line)}
#tree li>ul>li:first-child::after{top:50%}
#tree li>ul>li:last-child::after{bottom:50%}
#tree li>ul>li:only-child::after{display:none}
#tree li.has>.node{margin-right:var(--gap)}
#tree li.has>.node::after{content:"";position:absolute;right:calc(var(--gap) * -1);top:50%;width:var(--gap);border-top:3px solid var(--line)}
/* 부모 줄과 자식 세로줄이 맞닿게 */
#tree li.has>ul{margin-left:calc(var(--gap) * -1)}

.node{
  position:relative;flex:none;width:118px;text-align:center;cursor:pointer;
  padding:6px 4px 7px;border:2px solid transparent;background:transparent;
  font:inherit;color:inherit;
}
@media (hover:hover){.node:hover{background:var(--surface);border-color:var(--edge)}}
.node:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.node.sel{background:var(--raised);border-color:var(--cyan)}
.node.path{border-color:var(--cyan);border-style:dashed}
.node.hit{background:#3a2a10;border-color:var(--gold)}
.node.dim{opacity:.35}
.top{min-height:26px;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--mono);font-size:max(12px,calc(9.5px / var(--k,1)));font-weight:600;color:var(--cyan)}
.top img{height:max(20px,calc(15px / var(--k,1)));width:auto}
.top .cn{color:var(--ink)}
.art{min-height:64px;display:flex;align-items:flex-end;justify-content:center}
.art img{image-rendering:pixelated}
.art img.soft,.bigart img.soft{image-rendering:auto}
.nm{margin-top:4px;font-size:max(13px,calc(10.5px / var(--k,1)));font-weight:600;line-height:1.25;word-break:keep-all;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px}
.nm img{height:max(16px,calc(12px / var(--k,1)));width:auto}
.assumed .nm::after{content:"?";color:var(--gold);font-family:var(--mono);font-size:11px}
/* 여러 알에서 시작하는 계통은 위아래로 나란히 놓는다 */
#tree>ul.roots>li{margin-bottom:56px;padding-bottom:0}
#tree>ul.roots>li:last-child{margin-bottom:0}
#tree>ul.roots{display:flex;flex-direction:column}
.node.mat{border-style:dashed;border-color:var(--edge)}
.tag{font-style:normal;font-size:10px;font-weight:600;color:var(--ground);background:var(--dim);padding:0 4px;line-height:1.5;margin-left:2px}
.tag.f{background:#ff6b6b}
/* 칸은 최소 너비만 정하고 큰 그림이면 그만큼 넓어진다. 이름은 최소 너비 안에서 줄바꿈 */
.node{width:auto;min-width:max(118px,calc(84px / var(--k,1)));-webkit-tap-highlight-color:transparent}
.nm{max-width:max(118px,calc(84px / var(--k,1)));margin-left:auto;margin-right:auto}



/* 팝업 */
.shade{position:fixed;inset:0;background:rgba(8,5,16,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.shade.on{display:flex}
.card{
  width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--surface);
  border:2px solid var(--edge);padding:18px 18px 16px;
}
.card .hd{display:flex;gap:14px;align-items:flex-end}
.card .hd .bigart{flex:none;width:130px;height:130px;display:flex;align-items:flex-end;justify-content:center;background:var(--ground);border:2px solid var(--edge-soft)}
.card .hd .bigart img{image-rendering:pixelated}
.card h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:24px;margin:0;line-height:1.2}
.card .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ground);border:1px solid var(--edge);padding:3px 8px;font-size:12.5px;color:var(--dim)}
.chip img{height:20px;width:auto}
.chip b{color:var(--ink);font-family:var(--mono);font-weight:600}
.card h3{margin:16px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--dimmer);font-family:var(--mono);text-transform:uppercase}
.route{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.route i{font-style:normal;color:var(--dimmer)}
.route button,.nextl button{
  background:var(--ground);border:1px solid var(--edge);color:var(--ink);font:inherit;font-size:12.5px;padding:2px 8px;cursor:pointer
}
.route button:hover,.nextl button:hover{border-color:var(--cyan);color:var(--cyan)}
.route button.cur{border-color:var(--cyan);color:var(--cyan);cursor:default}
.nextl{display:flex;flex-wrap:wrap;gap:6px}
.req{margin-top:6px;background:#f2edfa;border:1px solid var(--edge-soft);padding:8px;display:inline-block}
.req img{max-width:100%;height:auto;display:block}
.note{margin:6px 0 0;color:var(--dim);font-size:13px;white-space:pre-wrap}
.x{float:right;margin:-6px -6px 0 0}

/* 밝은 배경: 게임 진화표 그대로 흰 바탕. 검정·보라 아이콘과 몬스터의 검은 윤곽이 어두운 바탕에서 묻히는 걸 막는다 */
.scroller.light{background:#f4f1fb;color:#1b1530}
.scroller.light .node,.scroller.light .nm{color:#1b1530}
@media (hover:hover){.scroller.light .node:hover{background:#e6e0f3;border-color:#b9afd6}}
.scroller.light .node.sel{background:#ddd4f4;border-color:#2a8fa0}
.scroller.light .node.path{border-color:#2a8fa0}
.scroller.light .node.hit{background:#ffe3a6;border-color:#c98400}
.scroller.light .node.mat{border-color:#a89fc4}
.scroller.light .top{color:#0b7285}
.scroller.light .top .cn{color:#1b1530}
.scroller.light .tag{background:#6b5f8f;color:#fff}
.scroller.light .tag.f{background:#d6336c}
#upd{position:fixed;left:0;right:0;top:0;z-index:30;background:#ffb45c;color:#1b1530;font-weight:700;font-size:14px;padding:12px 14px;text-align:center;cursor:pointer;display:none}
#upd.on{display:block}

/* 계통 바로가기 */
.lines{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lines button{
  background:var(--surface);border:2px solid var(--edge);color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;padding:4px 11px;cursor:pointer;white-space:nowrap;
}
.lines button:hover,.lines button:active{border-color:var(--cyan);color:var(--cyan)}
.tip{display:none}

/* ── 폰: 화면을 꽉 채운 "지도"처럼. 위·아래·왼쪽·오른쪽으로 밀어서 본다 ── */
@media (max-width:700px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:0;overflow:hidden}
  .wrap{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;padding:0 8px}
  .mast{padding:6px 0 2px;display:flex;align-items:center;gap:8px}
  .eyebrow,.sub{display:none}
  h1{font-size:20px;margin:0;white-space:nowrap}
  .sitenav{margin-top:0;flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .sitenav::-webkit-scrollbar{display:none}
  .sitenav a{padding:4px 8px;white-space:nowrap;font-size:12px}
  .bar{position:static;margin:4px -8px 0;padding:6px 8px;flex-wrap:nowrap;border-bottom:0}
  .bar input{flex:1 1 0;padding:6px 8px;font-size:13px}
  .btn{padding:5px 11px}
  .lines{flex-wrap:nowrap;overflow-x:auto;margin:0 -8px;padding:2px 8px 4px;scrollbar-width:none}
  .lines::-webkit-scrollbar{display:none}
  .lines button{flex:none}
  .tip{display:block;font-size:11px;color:var(--dim);padding:0 0 4px}
  .scroller{flex:1;min-height:0;padding:10px 4px 80px;overscroll-behavior:contain;border-top:2px solid var(--edge-soft)}
  .legend{display:none}
}

.legend{margin-top:6px;padding:12px 14px;background:var(--surface);border:2px solid var(--edge-soft);color:var(--dim);font-size:12.5px;line-height:1.8}
.legend b{color:var(--ink)}
.legend img{height:18px;width:auto;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <span class="eyebrow">Pixel Monster &middot; Evolution</span>
  <h1>진화 도감</h1>
  <p class="sub">몬스터를 누르면 진화 경로와 다음 진화가 나옵니다</p>
  <nav class="sitenav">
    <a href="../">홈</a>
    <a href="../cody/">코디</a>
    <a href="../ego/">에고무기</a>
    <a href="../rune/">룬 계산기</a>
    <a href="../costume/">코스튬</a>
    <a href="../awaken/">각성몹</a>
    <a href="../underworld/">저승 지도</a>
    <a class="here" aria-current="page">진화</a>
  </nav>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="몬스터 이름 검색" autocomplete="off" aria-label="몬스터 이름 검색">
  <button class="btn" id="zo" aria-label="줄이기">−</button>
  <button class="btn" id="zi" aria-label="키우기">＋</button>
  <button class="btn" id="bgb" aria-label="배경 밝게/어둡게">◐</button>
  <span class="hint" id="cnt"></span>
</div>

<div class="lines" id="lines" aria-label="계통 바로가기"></div>
<div class="tip">손가락으로 밀어서 이동 · 두 손가락으로 확대/축소 · 몬스터를 누르면 자세히</div>

<div class="scroller"><div id="tree"></div></div>

<div class="legend" id="legend"></div>

</div>

<div id="upd" role="button"></div>
<div class="shade" id="shade"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script src="data.js?v=20261024e"></script>
<script src="img.js?v=20261024e"></script>
<script>
(function(){
  var NODES=EVO.NODES, ICONS=EVO.ICONS||{};
  var byId={}, kids={};
  NODES.forEach(function(n){byId[n.id]=n; kids[n.id]=[];});
  NODES.forEach(function(n){ if(n.p) kids[n.p].push(n); });

  function src(k){ return window.IMG&&IMG[k]; }
  function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function pic(k,alt){ var s=src(k); return s?'<img src="'+s+'" alt="'+esc(alt||"")+'">':""; }
  function num(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,",");}

  var tree=document.getElementById("tree");

  // ── 도트 그림 크기 ──
  // 점 하나가 실제 화면 픽셀로 정수 칸이 되도록 맞춘다. 소수 배율이면 점 크기가 들쭉날쭉해진다.
  // (윈도우 배율 125% 같은 devicePixelRatio 까지 계산)
  var K=1, DOT=4;   // DOT = 기본 크기에서 점 하나의 화면 크기(px)
  function isEgg(id){ return /^egg/.test(id); }
  function fit(im){
    var w=im.naturalWidth,h=im.naturalHeight; if(!w) return;
    var dpr=window.devicePixelRatio||1, d, zm=1;
    if(isEgg(im.dataset.id)){ im.style.width="28px"; im.style.height="auto"; return; }
    if(im.dataset.box){
      // 팝업: 정해진 칸 안에 들어가는 가장 큰 정수 배율
      var box=parseFloat(im.dataset.box);
      d=Math.max(1,Math.min(Math.floor(Math.min(box*dpr/w,box*dpr/h)),Math.round(8*dpr)));
    } else {
      // 진화표: 모든 몬스터를 같은 배율로 (게임처럼 큰 몬스터는 크게).
      // 트리 전체에 CSS zoom(K) 이 걸려 있으므로, 그림 크기는 zoom 으로 곱해진 뒤에도
      // 화면 픽셀의 정수 배가 되도록 K 로 나눠 둔다.
      d=Math.max(1,Math.round(DOT*K*dpr)); zm=K;
    }
    im.style.width=(w*d/dpr/zm)+"px"; im.style.height=(h*d/dpr/zm)+"px";
  }
  function onLoad(im,f){ if(im.complete&&im.naturalWidth) f(); else im.addEventListener("load",f); }
  function fitAll(){ Array.prototype.forEach.call(document.querySelectorAll(".art img,.bigart img"),fit); }
  window.addEventListener("resize",fitAll);   // 브라우저 확대(Ctrl +/-) 하면 dpr 이 바뀐다

  function build(n){
    var li=el("li", kids[n.id].length?"has":"");
    var b=el("button","node"+(n.assumed?" assumed":"")+(n.mat?" mat":"")+(n.fuse?" fuse":""));
    b.type="button"; b.dataset.id=n.id; b.setAttribute("aria-label",n.name+" 자세히");
    var top="";
    if(src("c_"+n.id)) top+=pic("c_"+n.id,"조건");
    if(src("c2_"+n.id)) top+=pic("c2_"+n.id,"조건");
    if(n.n) top+='<span class="cn">'+n.n+'</span>';
    if(n.cost!=null) top+=pic("cost","")+'<span>'+num(n.cost)+'</span>';
    b.appendChild(el("div","top",top));
    var art=el("div","art",pic(n.id,n.name)); b.appendChild(art);
    var nm='<span>'+esc(n.name)+'</span>'+pic("a_"+n.id,"")+(n.mat?'<em class="tag">재료</em>':"")+(n.fuse?'<em class="tag f">합체</em>':"");
    b.appendChild(el("div","nm",nm));
    var im=art.querySelector("img");
    if(im){
      im.dataset.id=n.id;
      if(isEgg(n.id)) im.classList.add("soft");
      onLoad(im,function(){fit(im);});
    }
    li.appendChild(b);
    if(kids[n.id].length){
      var ul=el("ul");
      kids[n.id].forEach(function(c){ul.appendChild(build(c));});
      li.appendChild(ul);
    }
    return li;
  }
  var root=el("ul","roots");
  NODES.filter(function(n){return !n.p;}).forEach(function(n){root.appendChild(build(n));});
  tree.appendChild(root);
  var TOTAL=NODES.filter(function(n){return n.p;}).length;
  document.getElementById("cnt").textContent=TOTAL+"종";

  // ── 경로 ──
  function pathOf(id){var a=[],n=byId[id];while(n){a.unshift(n);n=n.p?byId[n.p]:null;}return a;}
  var selId=null;
  function mark(id){
    selId=id;
    var onp={}; if(id) pathOf(id).forEach(function(n){onp[n.id]=1;});
    Array.prototype.forEach.call(tree.querySelectorAll(".node"),function(b){
      var i=b.dataset.id;
      b.classList.toggle("sel",i===id);
      b.classList.toggle("path",!!onp[i]&&i!==id);
    });
  }

  // ── 팝업 ──
  var shade=document.getElementById("shade"), card=document.getElementById("card"), lastFocus=null;
  function open(id){
    var n=byId[id]; if(!n) return;
    mark(id);
    var chips="";
    if(n.cost!=null) chips+='<span class="chip">'+pic("cost","")+'진화 수치 <b>'+num(n.cost)+'</b></span>';
    if(src("c_"+n.id)){
      var lab=ICONS["c_"+n.id];
      chips+='<span class="chip">'+pic("c_"+n.id,"")+(lab?esc(lab):"조건")+(n.n?' <b>'+n.n+'</b>':"")+'</span>';
    }
    if(src("c2_"+n.id)) chips+='<span class="chip">'+pic("c2_"+n.id,"")+'조건</span>';
    if(n.mat) chips+='<span class="chip">합체 재료</span>';
    if(src("a_"+n.id)){
      var al=ICONS["a_"+n.id];
      chips+='<span class="chip">'+pic("a_"+n.id,"")+(al?esc(al):"속성")+'</span>';
    }
    var h='<button class="btn x" data-close aria-label="닫기">✕</button>'+
      '<div class="hd"><div class="bigart">'+pic(n.id,n.name)+'</div><div><h2>'+esc(n.name)+'</h2><div class="meta">'+chips+'</div></div></div>';
    var p=pathOf(id);
    h+='<h3>진화 경로</h3><div class="route">'+p.map(function(x,i){
      return (i?'<i>→</i>':"")+'<button type="button" data-go="'+x.id+'"'+(x.id===id?' class="cur"':"")+'>'+esc(x.name)+'</button>';
    }).join("")+'</div>';
    if(n.assumed) h+='<p class="note" style="color:var(--gold)">사진이 잘려 있어 어느 몬스터에서 갈라지는지 확인되지 않았습니다. '+esc(byId[n.p].name)+'에서 이어진 것으로 두었습니다.</p>';
    if(n.fuse) h+='<h3>합체</h3><div class="route">'+n.fuse.map(function(f,i){
      return (i?'<i>✕</i>':"")+'<button type="button" data-go="'+f+'">'+esc(byId[f].name)+'</button>';
    }).join("")+'<i>→</i><button type="button" class="cur">'+esc(n.name)+'</button></div>';
    var made=NODES.filter(function(m){return m.fuse&&m.fuse.indexOf(id)>=0&&m.id!==id;});
    if(made.length) h+='<h3>합체에 쓰임</h3><div class="nextl">'+made.map(function(m){return '<button type="button" data-go="'+m.id+'">'+esc(m.name)+'</button>';}).join("")+'</div>';
    var k=kids[id].filter(function(c){return !c.mat;});
    h+='<h3>다음 진화</h3>'+(k.length?'<div class="nextl">'+k.map(function(c){return '<button type="button" data-go="'+c.id+'">'+esc(c.name)+'</button>';}).join("")+'</div>':'<p class="note">없음 (마지막 단계)</p>');
    var rq=n.req||(src("r_"+n.id)?"r_"+n.id:null);
    if(rq) h+='<h3>필요한 것</h3><div class="req">'+pic(rq,"")+'</div>';
    if(n.note) h+='<h3>메모</h3><p class="note">'+esc(n.note)+'</p>';
    card.innerHTML=h;
    var bi=card.querySelector(".bigart img");
    if(bi){ bi.dataset.box="124"; bi.dataset.id=n.id; if(isEgg(n.id)) bi.classList.add("soft"); onLoad(bi,function(){fit(bi);}); }
    lastFocus=document.activeElement;
    shade.classList.add("on");
    card.querySelector("[data-close]").focus();
  }
  function close(){shade.classList.remove("on"); if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(e){}}
  shade.addEventListener("click",function(e){
    if(e.target===shade||e.target.closest("[data-close]")){close();return;}
    var g=e.target.closest("[data-go]"); if(g&&!g.classList.contains("cur")){open(g.dataset.go);}
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&shade.classList.contains("on")) close(); });
  tree.addEventListener("click",function(e){
    var b=e.target.closest(".node"); if(b) open(b.dataset.id);
  });

  // ── 검색 ──
  var q=document.getElementById("q");
  q.addEventListener("input",function(){
    var v=q.value.trim().toLowerCase(), first=null, c=0;
    Array.prototype.forEach.call(tree.querySelectorAll(".node"),function(b){
      var hit=v&&byId[b.dataset.id].name.toLowerCase().indexOf(v)>=0;
      b.classList.toggle("hit",!!hit);
      b.classList.toggle("dim",!!v&&!hit);
      if(hit){c++; if(!first) first=b;}
    });
    document.getElementById("cnt").textContent=v?(c+"종 찾음"):(TOTAL+"종");
    if(first) first.scrollIntoView({block:"center",inline:"center",behavior:"smooth"});
  });

  // ── 크기 ──
  // 폰은 처음에 0.5배로 열어 가지가 이어서 보이게 한다. 단추나 두 손가락 벌리기로 키운다.
  var z=innerWidth<700?.5:1, saved=null;
  try{saved=parseFloat(localStorage.getItem("evoZoom2"));}catch(e){}
  if(saved>0) z=saved;
  function setZ(v){z=Math.round(Math.max(.3,Math.min(1.75,v))*100)/100;K=z;tree.style.setProperty("--k",z);fitAll();try{localStorage.setItem("evoZoom2",z);}catch(e){}}
  setZ(z);
  document.getElementById("zo").onclick=function(){setZ(z-.15);};
  document.getElementById("zi").onclick=function(){setZ(z+.15);};

  // 배경 밝게/어둡게 (처음엔 밝게)
  var sc0=document.querySelector(".scroller"), light=true;
  try{ if(localStorage.getItem("evoLight")==="0") light=false; }catch(e){}
  function setLight(v){ light=v; sc0.classList.toggle("light",v); try{localStorage.setItem("evoLight",v?"1":"0");}catch(e){} }
  setLight(light);
  document.getElementById("bgb").onclick=function(){ setLight(!light); };

  // 새 버전 알림: 폰이 예전 화면을 계속 열어 두고 있어도, 새 버전이 있으면 알려 준다
  var BUILD="20261024e";
  try{
    fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){
      t=(t||"").trim(); if(t&&t!==BUILD){
        var u=document.getElementById("upd"); u.textContent="새 버전이 있어요 — 여기를 눌러 새로고침"; u.classList.add("on");
        u.onclick=function(){ location.href=location.pathname+"?v="+Date.now(); };
      }
    }).catch(function(){});
  }catch(e){}

  // 두 손가락으로 벌리거나 모으면 크기 조절 (브라우저 확대는 도트를 뭉개므로 직접 처리)
  var sc=document.querySelector(".scroller"), pinch=null;
  function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
  sc.addEventListener("touchstart",function(e){
    if(e.touches.length===2){
      var r=sc.getBoundingClientRect(), cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
      pinch={d:dist(e.touches),z:z,cx:cx,cy:cy,px:(sc.scrollLeft+cx)/z,py:(sc.scrollTop+cy)/z};
    }
  },{passive:true});
  sc.addEventListener("touchmove",function(e){
    if(!pinch||e.touches.length!==2) return;
    e.preventDefault();
    setZ(pinch.z*dist(e.touches)/pinch.d);
    sc.scrollLeft=pinch.px*z-pinch.cx;
    if(sc.scrollHeight>sc.clientHeight+2) sc.scrollTop=pinch.py*z-pinch.cy;
  },{passive:false});

  // ── 계통 바로가기 (알이 여러 개라 줄기가 일곱 개 가까이 된다) ──
  var lines=document.getElementById("lines");
  NODES.filter(function(n){return !n.p;}).forEach(function(r){
    var first=kids[r.id][0]; if(!first) return;
    var b=el("button",null,esc(first.name)+" 계열");
    b.type="button";
    b.addEventListener("click",function(){ jumpTo(r.id,false); });
    lines.appendChild(b);
  });
  // 줄기의 알(맨 왼쪽)이 화면 왼쪽 위에 오도록 옮긴다. 줄기 전체는 위아래로 길게 퍼져 있어서 알은 그 한가운데에 있다.
  function jumpTo(id,smooth){
    var nd=tree.querySelector('.node[data-id="'+id+'"]'); if(!nd) return;
    var a=nd.getBoundingClientRect(), s=sc.getBoundingClientRect();
    var vert=sc.scrollHeight>sc.clientHeight+2, beh=smooth?"smooth":"auto";
    sc.scrollTo({left:Math.max(0,sc.scrollLeft+a.left-s.left-8),top:vert?Math.max(0,sc.scrollTop+a.top-s.top-90):sc.scrollTop,behavior:beh});
    if(!vert){ var bar=document.querySelector(".bar").getBoundingClientRect(); window.scrollBy({top:a.top-bar.bottom-90,behavior:beh}); }
  }
  // 폰에서는 열자마자 첫 줄기의 알이 보이게 한다 (그림 크기가 정해진 뒤에 한 번)
  if(innerWidth<700){
    var firstRoot=NODES.filter(function(n){return !n.p;})[0];
    var once=function(){ jumpTo(firstRoot.id,false); };
    if(document.readyState==="complete") setTimeout(once,50); else window.addEventListener("load",function(){ setTimeout(once,50); });
  }
  sc.addEventListener("touchend",function(e){ if(e.touches.length<2) pinch=null; });

  // ── 안내 ──
  var lg=document.getElementById("legend");
  lg.innerHTML='<b>보는 법</b> &nbsp; '+pic("cost","")+' 숫자 = 그 단계로 진화할 때 필요한 수치 · 이름 뒤 작은 그림 = 속성 아이콘 · 위쪽 그림은 게임 진화표에 있는 표시를 그대로 옮긴 것입니다.<br>'+
    '이름 뒤에 <b style="color:var(--gold)">?</b> 가 붙은 몬스터는 사진이 잘려 갈라지는 자리를 추정했습니다.';
})();
</script>
</body>
</html>
