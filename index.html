<meta name="viewport" content="width=device-width,initial-scale=1">
<title>테이머 코디 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#141020;
  --surface:#1d1730;
  --raised:#271f3f;
  --edge:#3a2f56;
  --edge-soft:#2b2242;
  --ink:#f2edfa;
  --dim:#9c8fb8;
  --dimmer:#6f6389;
  --lv5:#ff5d7a;
  --lv4:#c9c4dd;
  --lv3:#f273b0;
  --lv2:#6fcf4a;
  --lv1:#c08a52;
  --have:#6fcf4a;
  --dead:#5b4768;
  --warn:#ffb45c;
  --cyan:#6fd3e0;
}
*{box-sizing:border-box}
/* hidden 속성이 항상 이기도록. 아래 #cedit 처럼 display 를 지정한 규칙에 가려질 수 있다. */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;
  line-height:1.55;
  padding-bottom:72px;
}
/* 코스튬 탭이 한 줄에 14칸을 쓰기 때문에 본문을 조금 넓게 잡는다.
   1080px 이면 칸당 69px 밖에 안 나와 이름이 눌린다. */
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
h1,h2,.display{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:.01em}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.mast{padding:30px 0 14px}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dimmer);font-family:"IBM Plex Mono",monospace;font-weight:600;
}
.mast h1{font-size:30px;margin:6px 0 0;line-height:1.15}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:6px;margin-top:20px;
  border-bottom:2px solid var(--edge);
}
.tabs button{
  font:inherit;font-size:14px;font-weight:600;
  font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  background:transparent;color:var(--dimmer);
  border:2px solid transparent;border-bottom:0;
  padding:9px 16px 8px;margin-bottom:-2px;cursor:pointer;
  transition:color .12s,background .12s,border-color .12s;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{
  color:var(--ink);background:var(--surface);
  border-color:var(--edge);
}
.tabs button:focus-visible{outline:3px solid var(--lv3);outline-offset:-3px}

/* ---------- score panel ---------- */
.score{
  margin-top:18px;background:var(--surface);
  border:2px solid var(--edge);
  padding:18px 18px 16px;
  display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:end;
}
.total{display:flex;align-items:baseline;gap:8px}
.total b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:58px;line-height:.9;letter-spacing:-.01em}
.total .of{font-size:19px;color:var(--dim)}
.splits{display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:6px}
.split{text-align:right}
.split .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);font-family:"IBM Plex Mono",monospace}
.split .v{font-size:17px;font-weight:600}
.split .v small{color:var(--dim);font-weight:400;font-size:13px}
.track{
  grid-column:1/-1;margin-top:14px;height:16px;
  background:var(--ground);border:2px solid var(--edge);
  display:flex;overflow:hidden;
}
.track i{display:block;height:100%;transition:width .28s ease}
.track .live{background:var(--have)}
.track .gone{background:var(--dead)}
.legend{
  grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;
  font-size:12px;color:var(--dim);
}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;display:block;flex:none}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--ground) 78%,rgba(20,16,32,0));
  padding:16px 0 14px;margin-top:22px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
button{
  font:inherit;font-size:12.5px;font-weight:600;
  background:var(--surface);color:var(--dim);
  border:2px solid var(--edge-soft);border-radius:0;
  padding:7px 12px;cursor:pointer;transition:color .12s,border-color .12s;
}
button:hover{color:var(--ink);border-color:var(--edge)}
button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--lv3);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--edge-soft);margin:0 2px}
.search{
  font:inherit;font-size:13px;background:var(--surface);color:var(--ink);
  border:2px solid var(--edge-soft);padding:7px 11px;min-width:150px;flex:1 1 150px;max-width:230px;
}
.search::placeholder{color:var(--dimmer)}
.search:focus{outline:none;border-color:var(--lv3)}
.danger{margin-left:auto;border-color:#5c2f42;color:#d3849c}
.danger:hover{border-color:#8a4362;color:#ff9db4}

/* ---------- groups ---------- */
/* 화면 밖 구역은 브라우저가 그리기를 건너뛰게 한다.
   418칸을 한꺼번에 그리면 휴대폰에서 버벅인다. */
.group{margin-bottom:34px;content-visibility:auto;contain-intrinsic-size:auto 500px}
.ghead{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--edge);margin-bottom:14px}
.ghead h2{font-size:19px;margin:0}
.tag{
  font-size:10.5px;font-weight:600;letter-spacing:.1em;
  color:var(--warn);border:1px solid #6b4a26;background:#2a1f16;
  padding:2px 7px;font-family:"IBM Plex Mono",monospace;
}
.ghead .pts{margin-left:auto;font-size:13.5px;color:var(--dim)}
.ghead .pts b{color:var(--ink);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}

.card{
  background:var(--surface);border:2px solid var(--edge-soft);
  padding:10px 10px 9px;cursor:pointer;user-select:none;
  display:flex;flex-direction:column;gap:8px;
  transition:border-color .12s,background .12s;position:relative;
}
.card:hover{border-color:var(--edge);background:var(--raised)}
.card:focus-visible{outline:3px solid var(--lv3);outline-offset:2px}
.card.has{border-color:var(--have);background:#1b2a1a}
.card.has:hover{background:#213221}

.slot{
  aspect-ratio:1;background:var(--ground);
  border:1px dashed var(--edge);
  display:grid;place-items:center;overflow:hidden;
}
.slot.art{border-style:solid;border-color:var(--edge-soft)}
.card.has .slot{border-style:solid;border-color:#3f5c36}
.slot img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.slot svg{width:66%;height:66%;opacity:.5}
.card.has .slot svg{opacity:.95}

.card:not(.has) .slot img{filter:grayscale(.75) brightness(.72);transition:filter .12s}

.meta{display:flex;align-items:center;gap:7px}
.lv{
  width:20px;height:20px;flex:none;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#141020;
}
.nm{font-size:13px;line-height:1.3;color:var(--dim);word-break:keep-all}
.card.has .nm{color:var(--ink);font-weight:500}
.note{
  font-size:10.5px;color:var(--warn);font-family:"IBM Plex Mono",monospace;
  letter-spacing:.02em;margin-top:-3px;
}
.stat{
  font-size:11px;color:var(--dim);line-height:1.5;
  margin-top:-4px;word-break:keep-all;
}
.where{
  font-size:11px;color:var(--cyan);line-height:1.5;
  margin-top:-4px;word-break:keep-all;
}
.card.has .where{color:var(--dimmer)}
.mark{
  position:absolute;top:6px;right:6px;width:19px;height:19px;
  background:var(--have);color:#141020;display:none;place-items:center;
  font-size:12px;font-weight:700;line-height:1;
  box-shadow:0 0 0 2px #1b2a1a;
}
.card.has .mark{display:grid}

.empty{color:var(--dim);font-size:14px;padding:30px 0;text-align:center}
.notice{
  background:var(--surface);border:2px dashed var(--edge);
  padding:22px;margin-top:22px;color:var(--dim);font-size:13.5px;line-height:1.9;
}
.notice b{color:var(--ink);font-weight:600}
.notice code{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  background:var(--ground);border:1px solid var(--edge-soft);padding:2px 6px;color:var(--cyan);
}

/* ---------- footer ---------- */
footer{
  margin-top:36px;padding-top:18px;border-top:2px solid var(--edge-soft);
  font-size:12.5px;color:var(--dim);line-height:1.8;
}
.sync{
  position:fixed;left:16px;bottom:16px;font-size:11.5px;
  font-family:"IBM Plex Mono",monospace;color:var(--dim);
  background:var(--surface);border:1px solid var(--edge);padding:5px 10px;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.sync.show{opacity:1}

@media (max-width:560px){
  .score{grid-template-columns:1fr;gap:14px}
  .splits{justify-content:flex-start;padding-bottom:0}
  .split{text-align:left}
  .total b{font-size:46px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
  .tabs button{padding:9px 12px 8px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 유닛 코스튬 그리드 ---------- */
/* 원본 도감과 같은 배치 — 한 줄에 14칸 고정.
   화면이 좁으면 줄을 접지 않고 이 영역만 옆으로 스크롤한다. */
.cscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
/* 칸 너비를 픽셀로 고정한다. 폭을 비율(1fr)로 두면 시트를 1400% 로 늘려야 하는데,
   그렇게 하면 확대된 이미지가 1600만 픽셀이 되어 휴대폰 브라우저가 그리기를 포기한다. */
.cgrid{
  display:grid;grid-template-columns:repeat(14,48px);gap:6px;
  justify-content:start;
}
/* 이름 표시를 켜면 칸이 넓어지고 그림 아래에 글자가 붙는다. 열 수는 14로 그대로. */
.cgrid.named{grid-template-columns:repeat(14,86px);gap:5px}
.ccell{
  position:relative;cursor:pointer;user-select:none;
  border:2px solid var(--edge-soft);background:var(--surface);
  transition:border-color .12s,background .12s;
}
.cgrid:not(.named) .ccell{aspect-ratio:1}
.ccell:hover{border-color:var(--edge);background:var(--raised)}
.ccell:focus-visible{outline:3px solid var(--lv3);outline-offset:2px}
.ccell.has{border-color:var(--have)}
.ccell.sel{border-color:var(--lv3);box-shadow:0 0 0 2px var(--lv3)}
.ccell i{
  display:block;width:100%;aspect-ratio:1;
  /* background-size / position 은 칸 크기에 맞춰 JS 가 픽셀로 넣는다 */
  background-repeat:no-repeat;
  image-rendering:pixelated;
  /* 미보유는 미리 만들어 둔 흑백 시트를 쓴다. CSS 필터를 쓰면
     칸이 400개가 넘어가면서 클릭할 때마다 다시 칠하느라 버벅인다. */
  background-image:var(--g);
}
.ccell.has i{background-image:var(--c)}
/* 정보를 입력할 때는 보유 여부와 상관없이 모두 컬러로 보여준다.
   흑백이면 그림을 알아보기 어려워 어떤 코스튬인지 판단하기 힘들다. */
.cgrid.editing .ccell i{background-image:var(--c)}
.clabel{display:none;padding:5px 6px 6px;border-top:2px solid var(--edge-soft)}
.cgrid.named .clabel{display:block}
.clabel .cn{
  font-size:11.5px;line-height:1.3;color:var(--ink);font-weight:500;
  word-break:break-all;overflow-wrap:anywhere;
}
.clabel .cn.none{color:var(--dimmer);font-weight:400}
/* 획득처 아이콘 */
.sico{
  width:14px;height:14px;object-fit:contain;image-rendering:pixelated;
  vertical-align:-3px;margin-right:3px;
}
.sico.big{width:22px;height:22px;margin:0;flex:none}
.ce-srcrow{display:flex;align-items:center;gap:7px}
.ce-srcrow select{flex:1;min-width:0}
.clabel .cs{
  font-size:9.5px;line-height:1.35;color:var(--cyan);margin-top:2px;
  word-break:break-all;overflow-wrap:anywhere;
}
.clabel .cm{
  font-size:9.5px;line-height:1.35;color:var(--dim);margin-top:1px;
  word-break:break-all;overflow-wrap:anywhere;
}
.cmark{
  position:absolute;top:2px;right:2px;width:15px;height:15px;
  background:var(--have);color:#141020;display:none;place-items:center;
  font-size:10px;font-weight:700;line-height:1;z-index:1;
}
.ccell.has .cmark{display:grid}
/* 이름을 숨긴 촘촘한 보기에서도 정보가 들어간 칸은 표가 나게 한다 */
.ccell.hasinfo::after{
  content:"";position:absolute;left:3px;bottom:3px;
  width:6px;height:6px;background:var(--cyan);z-index:1;
}
.cgrid.named .ccell.hasinfo::after{display:none}

/* ---------- 정보 입력 패널 ---------- */
#cedit{
  position:sticky;top:56px;z-index:19;
  background:var(--raised);border:2px solid var(--lv3);
  padding:14px;margin-bottom:20px;
  display:grid;grid-template-columns:120px 1fr;gap:14px;
}
.ce-art{border:2px solid var(--edge);background:var(--ground);padding:4px}
.ce-art i{
  display:block;width:112px;height:112px;
  background-size:1568px 672px;background-repeat:no-repeat;
  image-rendering:pixelated;background-image:var(--c);
}
.ce-form{display:flex;flex-direction:column;gap:8px;min-width:0}
.ce-where{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--dim)}
.ce-where b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:17px;color:var(--ink)}
.ce-own{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:13px;color:var(--dim);cursor:pointer;letter-spacing:0;
  font-family:"IBM Plex Sans KR",sans-serif;
}
.ce-own input{width:16px;height:16px;accent-color:var(--have);cursor:pointer}
.ce-form label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.1em;color:var(--dimmer);font-family:"IBM Plex Mono",monospace}
.ce-form input,.ce-form select{
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
  border:2px solid var(--edge);padding:7px 9px;border-radius:0;
}
.ce-form input:focus,.ce-form select:focus{outline:none;border-color:var(--lv3)}
.ce-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
button.prime{background:var(--lv3);color:#141020;border-color:var(--lv3)}
button.prime:hover{color:#141020;border-color:var(--ink)}
.ce-tip{font-size:11.5px;color:var(--dimmer);line-height:1.6}
.ce-tip b{color:var(--dim)}
@media (max-width:560px){
  #cedit{grid-template-columns:1fr}
  .ce-art{max-width:120px}
}

.roinfo{
  background:var(--surface);border:2px solid var(--edge);
  padding:10px 14px;margin-bottom:18px;font-size:12.5px;color:var(--dim);
}
.roinfo b{color:var(--ink)}
/* 도감 사이트 네 페이지를 서로 오갈 수 있게 하는 줄.
   페이지마다 색 변수 이름이 달라서 대체값을 함께 적어 둔다
   (코디·룬·코스튬은 --surface/--edge, 에고는 --plate/--rule). */
.sitenav{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.sitenav a{
  font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
  font-size:12.5px;font-weight:600;line-height:1.2;text-decoration:none;
  color:var(--dim);
  background:var(--surface,var(--plate,transparent));
  border:2px solid var(--edge-soft,var(--rule-soft,currentColor));
  padding:5px 11px;
  transition:color .12s,border-color .12s;
}
.sitenav a:hover{color:var(--ink);border-color:var(--edge,var(--rule,currentColor))}
.sitenav a.here{background:var(--ink);color:var(--ground);border-color:var(--ink);cursor:default}
</style>
<div class="wrap">

<div class="mast">
  <div class="eyebrow">Pixel Monster &middot; Tamer</div>
  <h1>코디 도감</h1>
  <nav class="sitenav">
    <a class="here" aria-current="page">코디</a>
    <a href="ego/">에고무기</a>
    <a href="rune/">룬 계산기</a>
    <a href="costume/">코스튬</a>
  </nav>
</div>

<div id="panel-cody">

<section class="score">
  <div class="total"><b class="num" id="pts">0</b><span class="of num">/ <span id="ptsMax">0</span></span></div>
  <div class="splits">
    <div class="split"><div class="k">상시 획득</div><div class="v num" id="live">0 <small>/ <span id="liveMax">0</span></small></div></div>
    <div class="split"><div class="k">단종</div><div class="v num" id="dead">0 <small>/ <span id="deadMax">0</span></small></div></div>
    <div class="split"><div class="k">보유 개수</div><div class="v num" id="cnt">0 <small>/ <span id="cntMax">0</span></small></div></div>
  </div>
  <div class="track"><i class="live" id="barLive" style="width:0"></i><i class="gone" id="barDead" style="width:0"></i></div>
  <div class="legend">
    <span><i style="background:var(--have)"></i>보유</span>
    <span><i style="background:var(--dead)"></i>보유 · 단종 아이템</span>
    <span><i style="background:var(--edge)"></i>미보유</span>
  </div>
</section>

<div class="controls" id="controls">
  <button data-f="all" class="on">전체</button>
  <button data-f="miss">미보유</button>
  <button data-f="has">보유</button>
  <span class="sep"></span>
  <button data-f="5">Lv5</button>
  <button data-f="4">Lv4</button>
  <button data-f="3">Lv3</button>
  <button data-f="2">Lv2</button>
  <button data-f="1">Lv1</button>
  <span class="sep"></span>
  <button data-f="dead">단종</button>
  <input class="search" id="q" type="search" placeholder="아이템 검색" aria-label="아이템 검색">
  <button class="danger" id="reset">전체 해제</button>
</div>

<div id="list"></div>

<footer>
  카드를 누르면 보유 여부가 바뀌고 이 브라우저에 저장됩니다. 보는 사람마다 자기 체크가 따로 기록됩니다.<br>
  미보유 아이템은 스프라이트가 흑백으로 표시됩니다.<br>
  게임 안의 코디 점수와 위 숫자가 같아지면 체크가 정확한 것입니다.
</footer>
</div>

</div>

<div class="sync" id="sync"></div>

<script>
/* ================================================================
   코디 도감 데이터

const $=function(s){return document.querySelector(s)};
const syncNote=$("#sync");
let db=null;

function flash(msg){
  syncNote.textContent=msg;
  syncNote.classList.add("show");
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){syncNote.classList.remove("show")},1400);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* 아이템 이름 -> 슬롯 안에 들어갈 그림.
let canEdit=null;

/* 아이템 이름 -> 슬롯 안에 들어갈 그림.
   1) IMG 덮어쓰기  2) 아틀라스 스프라이트  3) 부위 실루엣 */
function artFor(name,lv){
  if(IMG[name]) return {art:'<img src="'+IMG[name]+'" alt="'+esc(name)+'" loading="lazy" decoding="async">',real:true};
  return {art:'<span style="color:var(--lv'+lv+');display:contents">'+(BODY_RE.test(name)?SPR.body:SPR.head)+'</span>',real:false};
}


/* ================================================================
   코디 도감
   ================================================================ */
const ITEMS=[];
D.forEach(function(g,gi){
  g[2].forEach(function(it){
    ITEMS.push({name:it[0],lv:it[1],note:it[2]||"",group:g[0],gi:gi,dead:g[1]==="단종"});
  });
});

const MAX={all:0,live:0,dead:0,count:ITEMS.length};
ITEMS.forEach(function(i){MAX.all+=i.lv;if(i.dead){MAX.dead+=i.lv}else{MAX.live+=i.lv}});

let own={},filter="all",query="";
ITEMS.forEach(function(i){own[i.name]=false});

const list=$("#list");
$("#ptsMax").textContent=MAX.all;
$("#liveMax").textContent=MAX.live;
$("#deadMax").textContent=MAX.dead;
$("#cntMax").textContent=MAX.count;

function match(i){
  if(query&&i.name.indexOf(query)<0&&i.group.indexOf(query)<0)return false;
  if(filter==="all")return true;
  if(filter==="miss")return !own[i.name];
  if(filter==="has")return !!own[i.name];
  if(filter==="dead")return i.dead;
  return String(i.lv)===filter;
}

/* 그룹 머리글의 점수를 다시 그리지 않고 숫자만 갱신한다 */
const headRefs=[];
function heads(){
  headRefs.forEach(function(h){
    let got=0;
    h.items.forEach(function(i){if(own[i.name])got+=i.lv});
    h.el.textContent=got;
  });
}

function render(){
  list.innerHTML="";
  headRefs.length=0;
  let shown=0;
  D.forEach(function(g,gi){
    const all=ITEMS.filter(function(i){return i.gi===gi});
    const vis=all.filter(match);
    if(!vis.length)return;
    shown+=vis.length;
    let tot=0,got=0;
    all.forEach(function(i){tot+=i.lv;if(own[i.name])got+=i.lv});
    const sec=document.createElement("section");
    sec.className="group";
    sec.innerHTML='<div class="ghead"><h2>'+g[0]+'</h2>'+
      (g[1]?'<span class="tag">'+g[1]+'</span>':'')+
      '<span class="pts num"><b>'+got+'</b> / '+tot+'</span></div>';
    headRefs.push({el:sec.querySelector(".pts b"),items:all});
    const grid=document.createElement("div");
    grid.className="grid";
    vis.forEach(function(i){
      const c=document.createElement("div");
      c.className="card"+(own[i.name]?" has":"");
      c.setAttribute("role","checkbox");
      c.setAttribute("aria-checked",String(!!own[i.name]));
      c.setAttribute("aria-label",i.name+" Lv"+i.lv);
      c.tabIndex=0;
      const a=artFor(i.name,i.lv);
      c.innerHTML='<span class="mark">&#10003;</span>'+
        '<div class="slot'+(a.real?" art":"")+'">'+a.art+'</div>'+
        '<div class="meta"><span class="lv" style="background:var(--lv'+i.lv+')">'+i.lv+'</span>'+
        '<span class="nm">'+esc(i.name)+'</span></div>'+
        (i.note?'<div class="note">'+esc(i.note)+'</div>':'');
      /* 클릭할 때 목록 전체를 다시 그리지 않는다. 그 카드만 바꾸고 숫자만 갱신 */
      const flip=function(){
        const on=!own[i.name];
        own[i.name]=on;
        c.classList.toggle("has",on);
        c.setAttribute("aria-checked",String(on));
        persist();
        tally();
        heads();
      };
      c.onclick=flip;
      c.onkeydown=function(e){
        if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}
      };
      grid.appendChild(c);
    });
    sec.appendChild(grid);
    list.appendChild(sec);
  });
  if(!shown)list.innerHTML='<p class="empty">조건에 맞는 코디가 없습니다.</p>';
  tally();
}

function tally(){
  let all=0,live=0,dead=0,cnt=0;
  ITEMS.forEach(function(i){
    if(!own[i.name])return;
    all+=i.lv;cnt++;
    if(i.dead){dead+=i.lv}else{live+=i.lv}
  });
  $("#pts").textContent=all;
  $("#live").firstChild.nodeValue=live+" ";
  $("#dead").firstChild.nodeValue=dead+" ";
  $("#cnt").firstChild.nodeValue=cnt+" ";
  $("#barLive").style.width=(live/MAX.all*100)+"%";
  $("#barDead").style.width=(dead/MAX.all*100)+"%";
}

let pending=null;
/* 보유 체크는 보는 사람마다 달라야 하므로 각자 브라우저에 저장한다.
   고칠 권한이 있는 사람만 서버에도 올려 기기 간에 이어지게 한다. */
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(own))}catch(e){}
  if(!db||canEdit!==true)return;
  clearTimeout(pending);
  pending=setTimeout(function(){
    db.doc("state/checklist").set({own:own,updatedAt:Date.now()})
      .then(function(){flash("저장됨")})
      .catch(function(){});
  },600);
}

function apply(saved){
  if(!saved||typeof saved!=="object")return false;
  let touched=false;
  ITEMS.forEach(function(i){
    if(i.name in saved){own[i.name]=!!saved[i.name];touched=true}
  });
  return touched;
}

try{
  const raw=localStorage.getItem(KEY);
  if(raw)apply(JSON.parse(raw));
}catch(e){}
render();

$("#controls").onclick=function(e){
  const b=e.target.closest("button[data-f]");
  if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll("#controls button[data-f]").forEach(function(x){
    x.classList.toggle("on",x===b);
  });
  render();
};
$("#q").oninput=function(e){query=e.target.value.trim();render()};
$("#reset").onclick=function(){
  ITEMS.forEach(function(i){own[i.name]=false});
  persist();render();
};

/* ---------------- 동기화 · 권한 ---------------- */
/* 체크는 보는 사람마다 달라야 하므로 각자 브라우저에 저장한다.
   고칠 권한이 있는 사람만 서버에도 올려 기기 간에 이어지게 한다. */
if(window.claude&&claude.use){
  claude.use("db").then(function(d){
    if(!d){canEdit=false;return}
    db=d;
    d.doc("meta/access").set({at:Date.now()})
      .then(function(){
        canEdit=true;
        d.doc("state/checklist").onSnapshot(function(snap){
          if(!snap.exists)return;
          const data=snap.data();
          if(data&&apply(data.own)){
            try{localStorage.setItem(KEY,JSON.stringify(own))}catch(e){}
            render();
          }
        },function(){});
      })
      .catch(function(){
        canEdit=false;
        const note=document.createElement("div");
        note.className="roinfo";
        note.innerHTML="<b>읽기 전용</b> — 체크는 자유롭게 하실 수 있고, "+
          "이 브라우저에만 저장되어 다른 사람에게 보이지 않습니다.";
        list.parentNode.insertBefore(note,list);
      });
  }).catch(function(){canEdit=false});
}else{
  canEdit=false;
}

/* ================================================================
   체크 옮기기
   사이트는 서버를 쓰지 않아 체크가 브라우저마다 따로 저장된다.
   기기를 옮길 때 쓰라고, 보유 목록을 짧은 코드 한 줄로 만든다.
   152종을 한 칸당 1비트로 담아 19바이트 -> 글자 26개쯤 된다.
   ================================================================ */
function b64u(bytes){
  let s="";
  for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64u(str){
  str=str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  const bin=atob(str),out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
/* ITEMS 순서대로 보유 여부를 비트로 담는다. 순서가 바뀌면 옛 코드는 못 읽는다. */
function checkCode(){
  const bytes=new Uint8Array(Math.ceil(ITEMS.length/8));
  ITEMS.forEach(function(it,i){ if(own[it.name])bytes[i>>3]|=1<<(i&7) });
  return b64u(bytes);
}
function applyCode(code){
  let bytes;
  try{ bytes=unb64u(code) }catch(e){ return false }
  if(bytes.length!==Math.ceil(ITEMS.length/8))return false;
  ITEMS.forEach(function(it,i){ own[it.name]=!!(bytes[i>>3]&(1<<(i&7))) });
  return true;
}

/* 주소에 ?restore=코드 가 붙어 있으면 그 체크를 가져온다 */
(function(){
  const m=/[?&]restore=([A-Za-z0-9_-]+)/.exec(location.search);
  if(!m)return;
  if(applyCode(m[1])){
    try{localStorage.setItem(KEY,JSON.stringify(own))}catch(e){}
    render();
    flash("체크를 가져왔습니다");
  }else{
    alert("체크 코드를 읽지 못했습니다.\n주소가 중간에 잘렸는지 확인해 주세요.");
  }
  history.replaceState(null,"",location.pathname);
})();

/* 조작줄에 [체크 옮기기] 를 단다 */
(function(){
  const ref=$("#reset");
  if(!ref)return;
  const btn=document.createElement("button");
  btn.id="codeBtn";
  btn.textContent="체크 옮기기";
  ref.parentNode.insertBefore(btn,ref);
  btn.onclick=function(){
    let got=0;
    ITEMS.forEach(function(i){ if(own[i.name])got++ });
    const url=location.origin+location.pathname+"?restore="+checkCode();
    window.prompt(
      "지금 체크 "+got+"종을 담은 주소입니다.\n"+
      "복사해서 다른 기기(폰 등)에서 열면 체크가 그대로 옮겨집니다.\n"+
      "카톡으로 자신에게 보내 두면 백업도 됩니다.",
      url);
  };
})();
